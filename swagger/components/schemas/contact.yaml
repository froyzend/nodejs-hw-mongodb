type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType

properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phoneNumber"
    type: string
    example: '+380123456789'
  contactType:
    description: "Contact's contactType"
    type: string
    enum: ['personal', 'work', 'home']
  photo:
    description: 'Link to contact photo'
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/1739267613941_i.jpg
